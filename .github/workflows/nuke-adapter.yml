name: Nuke adapter contracts

on:
  push:
    branches: [main]
    paths: ['nuke/**', '.github/workflows/nuke-adapter.yml']
  pull_request:
    branches: [main]
    paths: ['nuke/**', '.github/workflows/nuke-adapter.yml']

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r nuke/tests/requirements.txt
      - run: python -m pytest -c /dev/null -p no:cacheprovider nuke/tests -q
      - run: ruff check nuke
      - run: ruff format --check nuke
